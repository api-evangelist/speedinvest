aid: speedinvest
name: Speedinvest
description: >-
  Speedinvest is one of Europe's most active early-stage venture capital firms, founded in 2011 by
  Oliver Holle and headquartered in Vienna, Austria, with additional offices in Berlin, London, Munich,
  and Paris across EMEA. The firm invests from pre-seed and seed through selective growth stages, writing
  typical early-stage checks of roughly EUR 500K to EUR 3M (and up to around $10M in later rounds), and
  manages more than EUR 1.2 billion in assets under management. Speedinvest runs a specialist model built
  around dedicated sector teams rather than generalists: AI & Infra, Climate Tech & Industrial Tech,
  Deep Tech, Fintech & DeFi, Health & Bio, Marketplaces & Consumer, Growth, and Middle East, Africa &
  Beyond. Its "many move more" thesis pairs early capital with hands-on operational support, talent,
  customer introductions, and a global follow-on network. The firm backs technical founders across Europe
  and beyond, with a portfolio of 400+ companies including Bitpanda, Tide, GoStudent, Wayflyer, Curve,
  Adverity, Bitmovin, CoachHub, and Prewave.
